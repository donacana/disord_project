name: collect

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = KST 08:00
  workflow_dispatch:        # 수동 실행 버튼도 생김

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: RSS 수집
        run: python collector/collector.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}

      - name: 네이버 수집
        run: python collector/sources_naver.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        continue-on-error: true   # 네이버 키가 아직 없거나 실패해도 RSS 수집은 항상 성공 처리